name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A pull request keeps one run: a newer push cancels the older one. Every commit on main gets its
  # own run, so none is cancelled or skipped; deploys are serialized by the deploy job's group.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Generated files match the committed ones
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated files are out of date. Run 'pnpm codegen' and commit the result."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Story tests run in Chromium (Vitest browser mode).
      - run: pnpm --filter @gesso/web exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build-storybook

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # A run for an older commit (a re-run, or one that waited behind a newer deploy) must not
      # replace what is deployed, so only the commit main points at now is deployed.
      - name: Check this is the latest commit on main
        id: latest
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is now at $latest, so $GITHUB_SHA is not deployed."
          fi
      - if: steps.latest.outputs.deploy == 'true'
        uses: pnpm/action-setup@v6
        with:
          cache: true
      - if: steps.latest.outputs.deploy == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - if: steps.latest.outputs.deploy == 'true'
        run: pnpm install --frozen-lockfile
      # `pnpm deploy` is a built-in pnpm command, so the script is called with `run`.
      - if: steps.latest.outputs.deploy == 'true'
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
