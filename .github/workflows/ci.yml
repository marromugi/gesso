name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A run on main may be deploying; only pull request runs are cancelled by a newer push.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      - run: pnpm codegen
      - name: Generated files match the committed ones
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            git diff
            echo "::error::Generated files are out of date. Run 'pnpm codegen' and commit the result."
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm build-storybook

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile
      # `pnpm deploy` is a built-in pnpm command, so the script is called with `run`.
      - run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
